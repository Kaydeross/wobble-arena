name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm install
      - run: npm test
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Four parallel shards: the whole suite is ~19 min sequential on a Linux runner; the longest shard is ~5-6 min.
    # Trade-off: a few more total CI minutes for ~3x shorter wall clock. fail-fast false: every shard reports.
    strategy:
      fail-fast: false
      matrix:
        shard: [ui, sim, net, rest]
    env:
      GODOT: /opt/godot/godot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/cache@v4
        with:
          path: /opt/godot
          key: godot-4.7.2-linux-${{ runner.os }}
      - name: Install Godot 4.7.2 (headless tests, no export templates needed)
        run: |
          if [ ! -x /opt/godot/godot ]; then
            mkdir -p /opt/godot && cd /opt/godot
            curl -fsSL -o g.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
            unzip -q g.zip && mv Godot_v4.7.2-stable_linux.x86_64 godot && chmod +x godot
          fi
      - run: npm ci || npm install
      - run: timeout 180 $GODOT --headless --path godot --import || true
      - run: npm run test:godot-physics
        if: matrix.shard == 'rest'
      - run: npm run test:godot-combat
        if: matrix.shard == 'rest'
      - run: npm run test:godot-spring
        if: matrix.shard == 'sim'
      - run: npm run test:godot-world
        if: matrix.shard == 'sim'
      - run: npm run test:godot-wobbler
        if: matrix.shard == 'sim'
      - run: npm run test:godot-weapons
        if: matrix.shard == 'sim'
      - run: npm run test:godot
        if: matrix.shard == 'sim'
      - run: npm run test:godot-netguest
        if: matrix.shard == 'sim'
      - run: npm run test:godot-host
        if: matrix.shard == 'net'
      - run: npm run test:godot-music
        if: matrix.shard == 'rest'
      - run: npm run test:godot-quests
        if: matrix.shard == 'rest'
      - run: npm run test:godot-modes
        if: matrix.shard == 'sim'
      - run: npm run test:godot-whats-new
        if: matrix.shard == 'rest'
      - run: npm run test:godot-flow
        if: matrix.shard == 'rest'
      - run: npm run test:godot-touch
        if: matrix.shard == 'rest'
      - run: npm run test:godot-touch-layout
        if: matrix.shard == 'rest'
      - run: npm run test:godot-kids
        if: matrix.shard == 'rest'
      - run: npm run test:godot-ranking
        if: matrix.shard == 'rest'
      - run: npm run test:godot-ui
        if: matrix.shard == 'ui'
      - run: npm run test:godot-audio
        if: matrix.shard == 'rest'
      - run: npm run test:godot-settings
        if: matrix.shard == 'rest'
      - run: npm run test:godot-save
        if: matrix.shard == 'rest'
      - run: npm run test:godot-locker
        if: matrix.shard == 'rest'
      - run: npm run test:godot-damage
        if: matrix.shard == 'rest'
      - run: npm run test:godot-skills
        if: matrix.shard == 'rest'
      - run: npm run test:godot-gunfeel
        if: matrix.shard == 'rest'
      - run: npm run test:godot-fx
        if: matrix.shard == 'rest'
      - run: npm run test:godot-perf
        if: matrix.shard == 'rest'
      - run: npm run test:godot-countdown
        if: matrix.shard == 'rest'
      - run: npm run test:godot-start-spots
        if: matrix.shard == 'rest'
      - run: npm run test:godot-quick-play
        if: matrix.shard == 'rest'
      - run: npm run test:godot-killcam
        if: matrix.shard == 'rest'
      - run: npm run test:godot-camera
        if: matrix.shard == 'rest'
      - run: npm run test:godot-construction-data
        if: matrix.shard == 'net'
      - run: npm run test:godot-dlc-ui
        if: matrix.shard == 'rest'
        continue-on-error: true   # known Linux headless teardown crash: visible, not blocking
      - run: npm run test:godot-site-map
        if: matrix.shard == 'net'
      - run: npm run test:godot-sandbox
        if: matrix.shard == 'net'
      - run: npm run test:godot-range
        if: matrix.shard == 'net'
      - run: npm run test:godot-maps
        if: matrix.shard == 'net'
      - run: npm run test:godot-dynamics
        if: matrix.shard == 'net'
      - run: npm run test:godot-ragdoll
        if: matrix.shard == 'rest'
      - run: npm run test:godot-integration
        if: matrix.shard == 'sim'
      - run: npm run test:godot-construction
        if: matrix.shard == 'net'
      - run: npm run test:godot-arcade
        if: matrix.shard == 'sim'
      - run: npm run test:godot-account
        if: matrix.shard == 'rest'
      - run: npm run test:godot-remote-config
        if: matrix.shard == 'rest'
      - run: npm run test:godot-services
        if: matrix.shard == 'rest'
      - run: BOTS_MINUTES=2 npm run test:godot-bots
        if: matrix.shard == 'net'
  export-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT: /opt/godot/godot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /opt/godot
          key: godot-export-4.7.2-linux-${{ runner.os }}
      - name: Install Godot and web export templates
        run: |
          mkdir -p /opt/godot
          if [ ! -x /opt/godot/godot ]; then
            cd /opt/godot
            curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
            unzip -q godot.zip && mv Godot_v4.7.2-stable_linux.x86_64 godot && chmod +x godot
          fi
          TPL="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          if [ ! -f "$TPL/web_release.zip" ]; then
            mkdir -p /tmp/godot-templates "$TPL"
            curl -fsSL -o /tmp/godot-templates/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
            unzip -q /tmp/godot-templates/templates.tpz -d /tmp/godot-templates
            cp -R /tmp/godot-templates/templates/. "$TPL/"
          fi
      - run: timeout 180 $GODOT --headless --path godot --import || true
      - name: Export web build
        run: |
          mkdir -p build/web
          timeout 300 $GODOT --headless --path godot --export-release "Web" "$PWD/build/web/index.html"
          test -s build/web/index.html
          test -s build/web/index.pck
