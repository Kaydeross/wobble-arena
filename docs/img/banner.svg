<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Wobble Arena: a wobbly-physics party brawler">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d5c"/><stop offset=".6" stop-color="#4b2f7a"/><stop offset="1" stop-color="#1b2f55"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d65e"/><stop offset="1" stop-color="#c99a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffcf5a" stop-opacity=".45"/><stop offset="1" stop-color="#ffcf5a" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#150d33"/></filter>
    <g id="wob">
      <ellipse cx="0" cy="62" rx="26" ry="6" fill="#000" opacity=".25"/>
      <rect x="-20" y="-4" width="40" height="52" rx="18" fill="currentColor"/>
      <circle cx="0" cy="-26" r="24" fill="currentColor"/>
      <rect x="-30" y="6" width="12" height="32" rx="6" fill="currentColor" transform="rotate(25 -24 6)"/>
      <rect x="18" y="6" width="12" height="32" rx="6" fill="currentColor" transform="rotate(-25 24 6)"/>
      <rect x="-16" y="42" width="13" height="22" rx="6" fill="currentColor"/>
      <rect x="3" y="42" width="13" height="22" rx="6" fill="currentColor"/>
      <circle cx="-8" cy="-30" r="6" fill="#fff"/><circle cx="9" cy="-30" r="6" fill="#fff"/>
      <circle cx="-6" cy="-29" r="3" fill="#1a1238"/><circle cx="11" cy="-29" r="3" fill="#1a1238"/>
      <path d="M-8 -16 Q0 -10 8 -16" stroke="#1a1238" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1280" height="400" fill="url(#sky)"/>
  <circle cx="1090" cy="80" r="46" fill="#fff6cf" opacity=".9"/>
  <circle cx="640" cy="170" r="330" fill="url(#glow)"/>
  <g fill="#fff" opacity=".7"><circle cx="120" cy="60" r="2"/><circle cx="300" cy="35" r="1.6"/><circle cx="520" cy="55" r="2"/><circle cx="780" cy="30" r="1.6"/><circle cx="960" cy="70" r="2"/><circle cx="1200" cy="150" r="1.6"/><circle cx="60" cy="170" r="1.6"/></g>
  <!-- distant low-poly hills -->
  <path d="M0 300 L120 215 L230 290 L360 200 L500 295 L640 225 L790 300 L930 205 L1070 290 L1180 220 L1280 285 V400 H0Z" fill="#33275f" opacity=".85"/>
  <!-- floating arena platform -->
  <g filter="url(#sh)">
    <path d="M60 330 H1220 L1170 372 H110Z" fill="#8a6420"/>
    <rect x="60" y="318" width="1160" height="22" rx="8" fill="url(#floor)"/>
  </g>
  <!-- title -->
  <g font-family="'Arial Black','Segoe UI Black',Impact,sans-serif" font-weight="900" text-anchor="middle" filter="url(#sh)" stroke="#150d33" stroke-width="10" stroke-linejoin="round" paint-order="stroke">
    <g font-size="132" letter-spacing="2">
      <text x="402" y="170" fill="#fff" transform="rotate(-4 402 170)">W</text>
      <text x="506" y="164" fill="#ffcf5a" transform="rotate(3 506 164)">O</text>
      <text x="602" y="170" fill="#fff" transform="rotate(-3 602 170)">B</text>
      <text x="698" y="164" fill="#ffcf5a" transform="rotate(4 698 164)">B</text>
      <text x="782" y="170" fill="#fff" transform="rotate(-4 782 170)">L</text>
      <text x="872" y="164" fill="#ffcf5a" transform="rotate(3 872 164)">E</text>
    </g>
    <text x="640" y="278" font-size="96" letter-spacing="14" fill="#fff" stroke-width="9">ARENA</text>
  </g>
  <rect x="400" y="343" width="480" height="24" rx="12" fill="#150d33" opacity=".92"/>
  <text x="640" y="360" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="15" letter-spacing="2" fill="#ffcf5a">WOBBLY PHYSICS · PARTY BRAWLER · IN YOUR BROWSER</text>
  <!-- wobblers -->
  <g transform="translate(150 262) rotate(-8)" color="#ff7a8a"><use href="#wob"/></g>
  <g transform="translate(270 268) rotate(6) scale(.85)" color="#5ad1ff"><use href="#wob"/></g>
  <g transform="translate(1010 268) rotate(-6) scale(.85)" color="#7ee08a"><use href="#wob"/></g>
  <g transform="translate(1135 255) rotate(10)" color="#b78cff"><use href="#wob"/></g>
  <!-- impact stars -->
  <g fill="#ffcf5a" stroke="#150d33" stroke-width="3" stroke-linejoin="round">
    <path d="M205 200 l6 14 15 1 -11 10 4 15 -14 -8 -14 8 4 -15 -11 -10 15 -1z" transform="translate(10 -30) scale(.8)"/>
    <path d="M1075 195 l6 14 15 1 -11 10 4 15 -14 -8 -14 8 4 -15 -11 -10 15 -1z" transform="translate(60 40) scale(.8)"/>
  </g>
</svg>
